# Build check on every push / pull request: runs the M1 mission-logic and M2 ray-cast tests,
# builds the Member4 app (prebuild copies data_out -> public/data) and checks the data is in it.
# Deployment is done by Cloudflare Pages (see README "Deploy"), not by this workflow.
#
# What gets built: Member4/ (the app). Its build pulls in the other members' work:
#   - web/src/core/missionLogic.js   (M1: delay window, first failure, battery, countdowns)
#   - Member2/src/raycast*.js        (M2: independent ray-cast check, bundled as a Web Worker)
#   - data_out/                      (M1 + M2 data: sites, nearby points, masks, heightmaps,
#                                     angles, results, validation)
name: Build check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Member4/package-lock.json
      - name: Install
        working-directory: Member4
        run: npm ci
      - name: Mission-logic and ray-cast tests (M1, M2)
        run: |
          node --test web/tests/missionLogic.test.js
          node --test Member2/tests/raycast.test.js
      - name: Build (prebuild copies data_out -> public/data)
        working-directory: Member4
        run: npm run build
      - name: Check the data made it into the site
        run: |
          for f in sites.json nearby.json validation.json results/site04.json heightmap/site04_near.bin; do
            test -s "Member4/dist/data/$f" || { echo "missing dist/data/$f"; exit 1; }
          done
          echo "files: $(find Member4/dist -type f | wc -l)"; du -sh Member4/dist
