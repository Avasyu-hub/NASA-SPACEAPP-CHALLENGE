[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lunawise-member2-terrain"
version = "0.1.0"
description = "Lunar terrain horizon and heightmap pipeline for LunaWise"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pyproj>=3.6",
  "rasterio>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["lunawise_terrain*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
